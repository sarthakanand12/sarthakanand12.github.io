# The reading library — one record per paper, exported from the vault.
#
# There is no per-paper page and no prose here: a paper is metadata. Notes about
# a paper go in a blog post that lists its slug in `papers:`, which renders as a
# link in both directions (see src/pages/blogs/[slug].astro and PaperPanel).
#
# `id` IS the permanent slug. Project and blog backlinks reference it, and the
# build fails if one drifts out of data/graph.json. Never change an existing id.
#
# Grouped by theme, then title, mirroring the vault's folders. Order here is for
# reading convenience only — allPapers() sorts by title.

